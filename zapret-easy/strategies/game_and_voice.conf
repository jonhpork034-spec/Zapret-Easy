# Игровой режим zapret-easy: UDP-профили для nfqws2.
#
# Файл не заменяет активную стратегию. src/game_mode.py читает эти
# аргументы, добавляет их в /var/lib/zapret-easy/active.conf после основного
# профиля и перезапускает zapret-easy.service. Поэтому TCP-обход YouTube
# остаётся нетронутым.
#
# fake_default_udp — hex-блоб нулей; в upstream zapret2 такого имени нет,
# поэтому определяем его здесь, чтобы синтаксис
# --lua-desync=fake:blob=fake_default_udp оставался читаемым.
#
# Пример из ТЗ (Discord/STUN):
# --filter-udp=19294-19344,50000-65535 --filter-l7=discord,stun
# --lua-desync=fake:blob=fake_default_udp:repeats=2
#
# DBD не имеет L7-метки discord/stun, поэтому его диапазон вынесен в
# отдельный профиль без --filter-l7; иначе DBD-трафик не попал бы под правило.

--blob=fake_default_udp:0x00000000000000000000000000000000

--filter-udp=19294-19344
--lua-desync=fake:blob=fake_default_udp:repeats=2
--new

--filter-udp=3478,3479,5349,19302
--filter-l7=stun
--lua-desync=fake:blob=fake_default_udp:repeats=2
--new

--filter-udp=27015-27050,3074,4379-4380
--lua-desync=fake:blob=fake_default_udp:repeats=2
--new

--filter-udp=50000-65535
--filter-l7=discord,stun
--lua-desync=fake:blob=fake_default_udp:repeats=2
--new
